[project]
name = "chessgpt"
version = "0.1.0"
description = "Educational project: train small GPTs on chess and compare datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "pyarrow>=17",
    "pyyaml>=6",
    "torch>=2.9",
    "numpy>=2",
    "zstandard>=0.23",
    "pandas>=3.1.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# CUDA build of PyTorch for the GB10 (driver supports CUDA 13.0, aarch64).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessgpt"]
